name: Agentic Snap Test

on:
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap channel to test"
        type: string
        default: edge
      create_issues:
        description: "Automatically file GitHub issues for NEW findings in the tracker repo"
        type: boolean
        default: false

jobs:
  ai-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        uses: canonical/inference-snaps-dev/.github/actions/agentic-test@agentic-test
        with:
          snap-name: smollm2
          snap-channel: ${{ inputs.snap_channel }}
          create-issues: ${{ inputs.create_issues }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          issue-create-token: ${{ secrets.ISSUE_CREATE_TOKEN }}
