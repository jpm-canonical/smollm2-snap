# Run build/test tasks from a PR label or a reusable workflow call.
name: PR Label

on:
  pull_request:
    types: [ labeled ]
  workflow_call:
    inputs:
      trigger-label:
        description: Build/test task to run
        required: true
        type: string

concurrency:
  # Reusable calls must not cancel their caller's concurrency group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-pr-label
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build-test:
    name: ${{ inputs.trigger-label || github.event.label.name }}
    uses: canonical/inference-snaps-dev/.github/workflows/reuse-pr-build-test.yaml@label-ignore-fail
    with:
      trigger-label: ${{ inputs.trigger-label || github.event.label.name }}
      pr-number: "${{ github.event.pull_request.number }}"
      build-runner: |
        [
          "ubuntu-24.04",
          "ubuntu-24.04-arm"
        ]
      test-jobs-matrix: |
        [
          {
            "job-queue": "maas-systemtests-amd64",
            "provision-data": "distro: noble",
            "select-engine": "cpu",
            "test-chat-tps": true
          },
          {
            "job-queue": "mir-intel-noble",
            "provision-data": "distro: noble",
            "select-engine": "intel-cpu",
            "test-chat-tps": true
          },
          {
            "job-queue": "202111-29603",
            "provision-data": "distro: noble",
            "select-engine": "intel-gpu",
            "test-chat-tps": true
          },
          {
            "job-queue": "anbox-nvidia-amd64",
            "provision-data": "distro: noble",
            "install-nvidia-driver-version": 595,
            "select-engine": "nvidia-gpu",
            "test-chat-tps": true,
            "expected-tps": 9.4
          }
        ]
      snap-name: smollm2
      testflinger-client-id: ${{ vars.TESTFLINGER_CLIENT_ID }}
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN_PR }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      testflinger-secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
      
